name: Test and deploy Cellarium
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test cellular models and timeline
        run: npm test
      - name: Install the film renderer
        run: |
          npm install --no-save --package-lock=false @napi-rs/canvas@0.1.100
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation
      - name: Render all six films and covers
        env:
          CELLARIUM_FONT: /usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf
        run: node scripts/render-reels.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish playground
        id: deployment
        uses: actions/deploy-pages@v4
